project_id = "redbooth-management-system"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = false

[storage]
enabled = true

# Modern sb_publishable_ keys are accepted at the gateway. The function still
# validates the caller's Auth access token and ACTIVE ADMIN profile itself.
[functions.create-salesperson]
verify_jwt = false
